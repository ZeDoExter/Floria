version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: flora
      POSTGRES_DB: floratailor
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - floratailor-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - floratailor-network

  inventory-service:
    build:
      context: ./backend/inventory-service
    environment:
      PORT: 3001
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: flora
      POSTGRES_DB: floratailor
      GATEWAY_URL: http://gateway:3000
    depends_on:
      - postgres
    networks:
      - floratailor-network

  cart-service:
    build:
      context: ./backend/cart-service
    environment:
      NODE_ENV: development
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_URL: http://gateway:3000
      CORS_ORIGIN: http://localhost:4173
    depends_on:
      - redis
    networks:
      - floratailor-network

  order-service:
    build:
      context: ./backend/order-service
    environment:
      PORT: 3003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: flora
      POSTGRES_DB: floratailor
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:4173
    depends_on:
      - postgres
    networks:
      - floratailor-network

  payment-service:
    build:
      context: ./backend/payment-service
    environment:
      PORT: 3005
      NODE_ENV: development
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_fake}
      CORS_ORIGIN: http://localhost:4173
    networks:
      - floratailor-network

  gateway:
    build:
      context: ./backend/gateway
    environment:
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: super-secret-local-key
      CORS_ORIGIN: http://localhost:4173
      INVENTORY_SERVICE_URL: http://inventory-service:3001
      CART_SERVICE_URL: http://cart-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3005
    depends_on:
      - inventory-service
      - cart-service
      - order-service
      - payment-service
    ports:
      - '3000:3000'
    networks:
      - floratailor-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - gateway
    ports:
      - '4173:4173'
    networks:
      - floratailor-network

volumes:
  postgres-data:

networks:
  floratailor-network:
    driver: bridge
